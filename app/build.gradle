plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.moodic'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.moodic"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            buildConfigField "String", "Gemini_API_KEY", "\"AIzaSyCJBk8BZH8cqDvZZrunuuFfr5CTp-xlqVU\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "Gemini_API_KEY", "\"AIzaSyCJBk8BZH8cqDvZZrunuuFfr5CTp-xlqVU\""

        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Fix duplicate META-INF files
    packagingOptions {
        resources {
            pickFirst 'META-INF/INDEX.LIST'
            pickFirst 'META-INF/DEPENDENCIES'
            exclude 'META-INF/AL2.0'
            exclude 'META-INF/LGPL2.1'
            exclude 'META-INF/LICENSE.md'
            exclude 'META-INF/LICENSE-notice.md'
        }
    }
}

dependencies {
    // 1. The BOM must be first!
    implementation libs.firebase.bom

    // --- ANDROIDX & UI (These are fine in your TOML) ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // --- FIREBASE (DIRECT STRINGS - No more BOM or TOML issues) ---
    implementation 'com.google.firebase:firebase-analytics:22.0.2'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-firestore:25.0.0'
    implementation 'com.google.firebase:firebase-storage:21.0.0'
    implementation 'com.google.firebase:firebase-database:21.0.0'
    implementation("com.google.firebase:firebase-ai")

    // --- THE GUAVA FIX (Crucial for the 9 failures) ---
    implementation 'com.google.guava:guava:33.0.0-android'
    implementation 'com.google.guava:listenablefuture:1.0'

    // --- NETWORKING & UTILS (From your TOML) ---
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // YouTube (Careful with these)
    implementation(libs.google.api.services.youtube.vv3rev2221250) {
        exclude group: "com.google.guava", module: "guava-jdk5"
    }
}