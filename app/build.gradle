plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.moodic'
    compileSdk 36 // Latest 2026 Standard

    defaultConfig {
        applicationId "com.example.moodic"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "Test_Key", "\"AIzaSyC7OIDw6HHN2CIoxdomG86OVpj_vo3whs0\""
        buildConfigField "String", "SHA1", "\"89:F5:00:09:75:CA:6A:20:13:01:25:5F:DC:67:A8:D8:D9:2C:24:C7\""
    }

    buildFeatures {
        buildConfig = true
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            pickFirst 'META-INF/INDEX.LIST'
            pickFirst 'META-INF/DEPENDENCIES'
            exclude 'META-INF/AL2.0'
            exclude 'META-INF/LGPL2.1'
            exclude 'META-INF/LICENSE.md'
            exclude 'META-INF/LICENSE-notice.md'
        }
    }
}

dependencies {
    // 1. FIREBASE BoM (Bill of Materials) - Updated to March 2026 Stable
    implementation platform("com.google.firebase:firebase-bom:34.10.0")

    // 2. CORE LIBRARIES (From your Catalog/TOML)
    implementation libs.appcompat
    implementation libs.material
    implementation libs.recyclerview
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 3. FIREBASE SERVICES (Using BoM for version control)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'

    // 4. THE AI FIX: Specifically for Firebase AI Logic
    implementation 'com.google.firebase:firebase-ai'

    // 5. THE JAVA FIX: Guava is mandatory for GenerativeModelFutures
    // This resolves the "Cannot find symbol ListenableFuture" errors
    implementation 'com.google.guava:guava:33.0.0-android'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    // 6. NETWORKING & UTILS
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // 7. YOUTUBE API (With careful exclusion to prevent library clashing)
    implementation(libs.google.api.services.youtube.vv3rev2221250) {
        exclude group: "com.google.guava", module: "guava-jdk5"
    }
}
